name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # Uruchom na najnowszej dostępnej maszynie z systemem Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. Pobierz kod źródłowy z Twojego repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Ustaw środowisko Java Development Kit (JDK) w wersji 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # Popularna i darmowa dystrybucja Javy
          cache: 'maven' # Włącz buforowanie (cache) dla Mavena, aby przyspieszyć przyszłe buildy

      # 3. Zbuduj projekt za pomocą Mavena
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # (Opcjonalnie) Możesz dodać tutaj kolejne kroki, np. do wysyłania zbudowanego pliku .jar
      # - name: Upload artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: package
      #     path: target/*.jar
