name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Pobierz kod źródłowy z Twojego repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Ustaw środowisko Java Development Kit (JDK) w wersji 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Zbuduj projekt za pomocą Mavena
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # 4. Zapisz zbudowany plik .jar jako artefakt do pobrania
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          # Nazwa, pod jaką plik będzie widoczny do pobrania
          name: EntityDetection-Plugin
          # Ścieżka do pliku, który ma zostać zapisany.
          # Używamy gwiazdki (*), aby pasowało do każdej nazwy pliku .jar w folderze target.
          path: target/*.jar
